# clive-harness-factory configuration (Phase 0).
# Everything is files + a SQLite store, for inspectability. No hidden state.

# --- target under test ------------------------------------------------------
# The factory is REPO-AGNOSTIC: it optimises whatever TARGET this section names.
# `provider` selects the adapter (factory/adapters/<provider>.py) that knows how
# to actuate a spec into, and invoke, that target. `clive` is the default and the
# reference adapter; `generic` is a config-driven command adapter for any repo
# invocable as `<python> <entry> [args…]` — spec knobs become env vars and an
# optional `exec:` block here declares the conventions (args template with
# {goal}, spec_env_prefix, max_tokens_env, model_env, session_dir_regex); see
# adapters/generic.py. Pointing the factory at a DIFFERENT repo = set `provider`
# to `generic` + root/entry below (install.sh does this), or for richer
# actuation (1) write a dedicated adapter under factory/adapters/, (2) register
# it in common.config.get_adapter, (3) name it here.
#
# BACKWARD COMPAT: a legacy top-level `clive:` block (the previous layout) is
# still honoured — common.config.target_config() treats it as the clive target,
# so older configs keep working unchanged. Where both exist, `target:` wins and
# `clive:` fills in any keys it omits.
target:
  provider: "clive"        # which adapter drives the target (default: clive)
  # Repo root of the TARGET being optimised. The factory is standalone
  # (/Development/factory), so this points at the sibling clive repo. Relative to
  # factory/, or absolute.
  root: "../clive"
  # Interpreter used to run the candidate target. CLAUDE.md: "no virtualenv is
  # active" — clive runs under system python3. Override to ".venv/bin/python"
  # if you keep deps in a venv.
  python: "python3"
  entry: "clive.py"
  # Toolset handed to the candidate unless a candidate spec's open block
  # actuates a different one.
  default_toolset: "minimal"
  # The graduation/release branch graduated work fast-forwards onto and is pushed
  # to origin. `factory graduate` (and the autopilot after a shift ships) does:
  # ff base_branch -> factory/auto, push origin base_branch, then sync the target's
  # GitHub issues for the pushed commits. Defaults to chore/extract-factory.
  base_branch: "chore/extract-factory"
  # release_branch: "main"   # optional — the target's GitHub DEFAULT branch, which the
  # shift-end publication-lag edge measures against (origin/<release_branch>..factory/auto);
  # graduation pushes base_branch but nothing auto-promotes it there. Defaults to "main".

# --- environment provisioning (§6, §11) ------------------------------------
env:
  provider: "local"        # local | docker  (local is the Phase-0 default)
  docker:
    image: "clive-factory-env:base"   # built from envs/Dockerfile.base
    network: "none"                    # no network reach by default
    mem_mb: 512
    pids_limit: 256

# --- budgets & concurrency (§5, §9, §11) -----------------------------------
budget:
  # Hard per-run cap handed to clive's --max-tokens. Generous enough that a
  # capable model can finish a real task; clive enforces it per-plan.
  per_run_max_tokens: 16000
  # Wall-clock cap per run (seconds). Circuit breaker.
  per_run_timeout_s: 200
  # Hard ceiling for a whole evaluation round (tokens). Abort + flag if exceeded.
  round_max_tokens: 400000
  # Cost model: tokens are priced via evals/harness/pricing.json when available.
  default_price_per_mtok: 1.0

concurrency:
  # Worker cap — evaluation is embarrassingly parallel but capped (gain governor).
  cap: 2

# --- triggers (§9) ----------------------------------------------------------
triggers:
  # Optimisation loop fires only when at least this many NEW failure cases have
  # accumulated since the last proposal. The gain governor.
  new_failures_to_propose: 3
  # Stop a search after K rounds with no measurable improvement (read against
  # the held-out signal, not in isolation).
  no_improvement_rounds: 3

# --- spec mutation rules (§4) ----------------------------------------------
spec:
  # "one bounded change": max number of top-level open keys a candidate may
  # change vs its parent. Frozen changes are always rejected.
  max_changed_open_keys: 1

# --- super-workers (full-capability claude -p; opt-in) ----------------------
# By default every role is an ISOLATED one-shot `claude -p` (no tools/plugins) — the
# safe, proven path. A role listed here instead runs as a SUPER-WORKER: a
# full-capability `claude -p` with a curated, Bash-LESS toolset (Read/Write/Edit/Grep/
# Glob + Task/Workflow for internal fan-out) under --permission-mode acceptEdits, with
# its file tools steered into its OWN disposable sandbox dir + a deny-by-default env +
# a turn cap. It can run /workflows + subagents internally but must still return its
# role's exact contract. The board + conductor + human promotion gate are unchanged.
#
# SOFT boundary (like the local env): safe for fan-out, but NOT a hard jail. Enabling
# Bash/web reopens host-file + network reach — those need the docker hard boundary
# (not yet wired for super-workers), and never enable a shell-capable super-worker for
# a blindness-critical role (the proposer) until then.
roles:
  # e.g. ["proposer"] or "*" for all. Empty = every role stays isolated (default).
  super_workers: []

# --- the Guest House: where a DEVELOPER super-worker runs (the fleet) -------
# A developer super-worker (which edits the target's CODE) runs as a separate macOS
# Standard User — a HARD, OS-enforced boundary protecting the operator's files/creds,
# so Bash is safe. Headless operation needs TWO one-time operator setups:
#   1. that user's OWN claude (a binary THAT user can execute — NOT the operator's
#      ~/.local/bin/claude, which is unreadable to them). Find it:
#        sudo -u Agent -i bash -lc 'command -v claude'
#   2. a passwordless sudoers grant so the headless factory never hits a password prompt:
#        sudo visudo -f /etc/sudoers.d/clive-factory
#        <operator> ALL=(Agent) NOPASSWD: <that claude path>
# Leave `user` empty to keep developer workers OFF until the Guest House is wired.
super_worker:
  user: "agent"
  claude_bin: "/Users/agent/.local/bin/claude"   # agent's OWN claude (a path agent can execute)
  # Load the worker's USER plugins/skills/MCP so it's a FULL claude instance — the agora
  # plugin, the diary skill, and MCP servers (chrome-devtools). "" = isolated (no
  # plugins/hooks/MCP). acceptEdits + the curated toolset keep non-listed MCP tools
  # (the operator's Gmail/Drive/etc.) out of reach even when loaded.
  settings: "user"
  # Extra tool grants beyond the curated developer set — e.g. an MCP server the developer
  # needs to test web things. VERIFY the exact allow-string on the first live run (the
  # MCP tool names appear as mcp__<server>__<tool>; the server-level grant is mcp__<server>).
  extra_tools:
    - "mcp__plugin_chrome-devtools-mcp_chrome-devtools"   # chrome-devtools (browser testing)
  # The agora squad the worker joins — its OWN, so a headless one-shot worker never blocks
  # on the operator's team barrier.
  squad: "factory-workers"
  # The rail auto-refills the backlog from research (a researcher super-worker proposes new
  # directions toward the mission) BEFORE a shift whenever the open backlog is below this
  # threshold — so the generative loop runs deterministically, not at the conductor's
  # discretion. Set to 0 to disable rail-driven research.
  refill_threshold: 2
  # GSD spec-driven pre-dispatch scope check: before a developer worker is spent, a fast
  # read-only judge decides whether each claimed task is ONE bounded, landable, testable
  # change (pass | split | reject). Kills no_candidate upstream where rejection is free.
  # Fail-open (a judge error -> dispatch anyway). Enabled 2026-06-27 (operator).
  scope_check: true
  scope_check_max_turns: 6
  scope_check_timeout_s: 180
  # GSD spec-bound acceptance gate: a candidate that changes SOURCE code but ships NO test is
  # discarded by the gate (stage 'no_test'), so a merge proves the work, not just non-regression.
  # Test-only / docs-only / empty diffs pass. Enabled 2026-06-30 (operator).
  require_test: true
  # Red-proof (Component E, docs/plans/2026-08-06-publication-broker-design.md): require_test
  # only proves a test FILE exists — it is gameable by a test that trivially passes either way.
  # When true (and require_test is also true — nothing to red-proof otherwise), each changed
  # test file must FAIL against a fresh detached worktree at the pristine base (before the
  # worker touched it) or the candidate discards (stage 'no_test', "test passes on the
  # pristine base"). A gate/verifier knob — FROZEN in harness_surface.FROZEN_KNOB_KEYS, board-
  # toggleable elsewhere (in SETTINGS_SPEC). Default false for bake-in.
  red_proof: false
  # Task 3.1 (Phase 3): spec-named acceptance EXECUTION gate (objective done-condition, P2). When
  # true, the spec's OWN named acceptance test — a tests/<path>.py[::name] ref extracted from
  # spec.acceptance — is RUN in the candidate AFTER the suite gate: a RED run discards the
  # candidate (stage 'acceptance'); a MISSING test (the worker didn't create the contracted ref)
  # is a telemetry-first SKIP (counted as a scope='acceptance' factory learning, NOT yet
  # discarded — that flip waits until the prompt contract is live and the skip rate is known).
  # A prose acceptance with no runnable ref → nothing runs (fail-open). Default OFF; board-
  # toggleable (in SETTINGS_SPEC — it is a gate the operator trials, not a brake).
  acceptance_exec: false
  # Task 3.2 (Phase 3): one INFORMED retry on a gradeable gate-discard (minimal maker→grader→
  # retry loop). When true, a candidate discarded at stage tests / no_test / acceptance (NEVER
  # 'frozen' — a structural safety veto a retry can only re-violate) gets EXACTLY ONE more
  # independent attempt, with the failure evidence appended and worded honestly (the retry clones
  # the PRISTINE base — the prior attempt's code is NOT visible, only its evidence). Budget-honest:
  # the retry is suppressed once the shift's ledgered spend has reached its token_budget (composes
  # with the per-shift brake, Task 0.2). Spend from both attempts sums into one ledger row. Default
  # OFF; board-toggleable (in SETTINGS_SPEC — a trial gate the operator opts into, not a brake).
  retry_on_discard: false
  # Task 3.3 (Phase 3): independent milestone-DELIVERY grader (objective done-condition, P2). When
  # true, `plan status <milestone> delivered` is REFUSED while any linked task is still unresolved
  # (open/claimed/in_progress/blocked — 'done' and 'dropped' are BOTH resolved, so a dropped task
  # never makes delivery unreachable) OR while the milestone has NO linked tasks (total==0 is
  # UNVERIFIABLE, not trivially complete); the refusal names the blocking task ids. A milestone that
  # still READS 'delivered' but no longer verifies renders as 'delivered (unverified)' in the
  # conductor's {PLAN} seam — a render-time label ONLY (milestones.status is CHECK-constrained with
  # no detail column, so it is NEVER stored). Default OFF; board-toggleable (a gate the operator
  # trials, not a brake).
  milestone_verify: false
  # Task 4.1 (Phase 4): post-shift INVESTIGATOR for blocked tasks (P6 stages 2-3). When true, AFTER
  # close-out up to 3 blocked-this-shift tasks that carry a task_evidence row — scoped to
  # discarded(tests) and error stages only (no_candidate is skipped: auto-decompose already gave a
  # second opinion; frozen/no_test are skipped: their canned lessons already state the cause) — get
  # ONE isolated claude_p at STANDARD tier over title+detail+spec+evidence -> {cause, lesson,
  # followup?}. The lesson is recorded scope='investigated' (analysis, not a verified check); spend
  # is ledgered notes='investigate' WITH the shift_id (folds into the loop token brake). STOP vetoes
  # even this read-only spend (checked FIRST); a transport/parse failure fails open to the canned
  # lesson (never crashes the close-out). A returned followup_title/detail is STORED on the lesson —
  # spawning the narrowed task is a separate follow-up, NOT done here. Default OFF; board-toggleable
  # (in SETTINGS_SPEC — a trial gate the operator opts into, not a brake).
  investigate_blocked: false
  # Self-organizing factory (Phase 2, Task 2.2): the shift-start ORGANIZER trigger. When true,
  # a shift whose active mission has NO org chart runs ONE isolated frontier claude_p
  # (roles/organizer/prompt.md) that designs a per-mission chart — classes, per-class stage
  # toggles/tiers, bench — validated in code (fail-closed) and cached until the mission changes
  # or `factory org replan`. Spend ledgers notes='organizer' WITH the shift_id. STOP vetoes the
  # call (checked first). Default OFF; config-ONLY and deliberately NOT in SETTINGS_SPEC —
  # ORG_BOOL_KEYS derives from the spec's bools, so listing it there would hand the organizer
  # control of its own trigger. `factory org plan|replan` (explicit human acts) work regardless.
  organizer: false
  # --- grading isolation (Phase 3, docs/plans/2026-08-09-worker-isolation-design.md) -------
  # The factory EXECUTES worker-authored code on every candidate: the test suite, the
  # red-proof nodes, the acceptance test, and the post-merge re-baseline. require_test above
  # MANDATES the worker ship a test, and the frozen gate never covers tests/ — so this is the
  # documented contract, not an attack. Unset (default), that code runs as the factory user,
  # i.e. with the blackboard, the credentials and the killswitch in reach.
  # Set to an unprivileged account and every such execution goes through
  # common/target_exec.py's single seam: `sudo -n -u <user> -- <grader_wrapper> <cwd> <argv>`.
  # No root and no chown are involved.
  # Config-ONLY and deliberately NOT in SETTINGS_SPEC: a knob that decides whether untrusted
  # code is contained must not be reachable from the dashboard's settings route or proposable
  # by the self-harness loop — a loop that can widen its own containment is not contained.
  # Enabling is an operator act, gated on the drill in docs/runbooks/worker-isolation.md.
  # ⚠ NOT READY TO ARM (2026-08-10 security review). The export handover is being
  # redesigned: the previous ACL-based grant let a candidate-committed symlink under tests/
  # stamp grader-writable ACEs onto the credentials file, FACTORY_ROOT and the factory home
  # — arming was strictly worse than leaving it off. The grant is disabled, so an armed
  # grader currently cannot write its export and grading fails loudly. Leave this empty.
  grader_user: ""
  # The operator-installed, READ-ONLY wrapper the sudoers rule pins (argv: <cwd> <cmd...>).
  # Never derived from anything a worker can influence.
  grader_wrapper: "/opt/factory/run-target-code"
  # Self-harness loop (docs/plans/2026-08-05-self-harness-loop-design.md): the shift-END
  # HARNESS ENGINEER trigger. When true, AFTER a shift's outcomes are recorded, an evidence-
  # freshness gate checks whether >= MIN_NEW_EVIDENCE (10) new task_evidence rows have landed
  # since the last proposal batch; if so, ONE isolated frontier claude_p (roles/
  # harness_engineer/prompt.md) reads reporting/weakness.py's deterministic failure clusters
  # and proposes up to 5 BOUNDED harness edits (knob settings / role-prompt patches /
  # learnings corrections), each citing the evidence that motivated it — validated in code
  # (fail-closed) and persisted as `harness_proposals` rows. NOTHING is ever applied
  # automatically: `factory harness apply <id>` is always a separate, explicit operator act,
  # and a `prompt` proposal never even auto-writes a file (it prints the patch for a human to
  # land by hand). Spend ledgers notes='harness_engineer' WITH the shift_id. STOP vetoes the
  # call (checked first). Default OFF; config-ONLY and deliberately NOT in SETTINGS_SPEC —
  # exactly like `organizer` above, so a proposal can never widen or re-arm its own trigger.
  # `factory harness mine|plan|show|apply|reject` (explicit human acts) work regardless.
  harness_engineer: false
  # GSD auto-decomposition: when a worker returns no_candidate (brief too big to land), split it
  # into a sequenced chain of single-surface sub-tasks (open, source=worker) instead of just
  # blocking — turning the #1 failure into forward progress. Complements scope_check (#1 splits
  # BEFORE dispatch; this splits AFTER a worker fails). Fail-safe (no split -> canned lesson).
  auto_decompose: true
  decompose_max_turns: 8
  decompose_timeout_s: 240
  # Task 5.2 (Phase 5): bounded same-shift SECOND WAVE (loop-until-dry, 2 waves MAX). 1 = today
  # (a no_candidate is decomposed and its sub-tasks wait for the next shift). 2 = after close-out,
  # if any no_candidate DECOMPOSED this shift, the rail CLAIMS the new sub-task ids and runs ONE
  # more identical pass with the decomposer OFF (a HARD recursion stop — never a wave 3). Fires
  # only when every brake clears: STOP disengaged, headroom under max_tasks_per_shift, shift spend
  # < token_budget (composes with the per-shift brake, Task 0.2), AND an EXPLICIT TIME GUARD —
  # elapsed + waves×1800s must fit the loop-deadline share (the executor has no wall-clock; the
  # loop deadline is checked only between shifts, so wave 2 reserves its own headroom or fails
  # CLOSED). Wave-2 sub-tasks inherit the parent's milestone_id (EVM/timesheet attribution). Default
  # 1; board-toggleable (in SETTINGS_SPEC). Trial with a LOW max_tasks — do NOT flip to 2 broadly.
  dispatch_waves: 1
  # Cap on ACTIVE worker capability profiles (Phase 5) — `worker add` beyond this fails with
  # "retire one first" so the conductor can't sprawl the bench. generalist doesn't count against
  # it (it's the fail-open default and can't be retired).
  max_profiles: 12
  # Claim leases (Component F, docs/plans/2026-08-06-publication-broker-design.md): a task
  # orphaned OUTSIDE a shift (or by a shift that never restarts) otherwise stays 'claimed'/
  # 'in_progress' forever — the dead-worker-holds-the-task-forever state. Every shift start
  # (and `factory task reap` on demand) reclaims any in-flight task whose claim is older than
  # this many minutes AND does not belong to the currently running shift. An EDITABLE capacity
  # knob (in SETTINGS_SPEC, board-toggleable, SANE_BOUNDS 10-1440) — NOT frozen: tuning lease
  # length is legitimate; it cannot disable the sweep itself (shift.py calls it unconditionally).
  claim_lease_minutes: 240
  # Phase 8 (config-gated OFF): a cheap pre-merge REVIEW gate. When true, an isolated blind
  # claude_p (frontier tier — review is judgment) reads git diff base..branch + the task and
  # returns {approve, reason}; a reject discards the candidate (blocked-task lesson). Fail-open
  # on a transport/parse failure (never blocks a merge on a reviewer hiccup). Default OFF — the
  # developer's own TDD is the primary gate; this adds an independent eye when the operator opts in.
  reviewer: false
  # The model TIER the pre-merge reviewer runs at (Task 2.2 routing knob — shares the claude_p
  # --model plumbing). '' = frontier (the account default; review is JUDGMENT, so frontier is the
  # deliberate default per the models block below). A named tier (standard/fast) down-tiers it;
  # resolve_model fails open DOWNWARD (never up to frontier on a typo). config.yaml-only — it is a
  # routing knob, not a board brake, and the reviewer path reads config directly (no store handle).
  reviewer_tier: ""
  # The model TIER the pre-dispatch SCOPE judge runs at (Task 2.4 cheap-grader knob — shares the
  # claude_super --model plumbing). '' = frontier (the account default; scope triage is JUDGMENT,
  # so frontier is the deliberate default per the models block below). A named tier (standard/fast)
  # down-tiers it so the judge stops burning frontier tokens per claimed task; resolve_model fails
  # open DOWNWARD (never up to frontier on a typo). Applies to scope_judge ONLY — decompose_judge is
  # a separate call path, left at the account default. config.yaml-only (the scope path reads config
  # directly, no store handle), a routing knob not a board brake — deliberately NOT in SETTINGS_SPEC.
  # Frontier-vs-fast on the eval-gate goldens is an OPERATOR act; the default stays frontier here.
  scope_check_tier: ""

# --- model tiers (worker routing, Phase 5) ----------------------------------
# Worker profiles name a TIER, never a raw model id. '' = the account's default model
# (frontier — reserved for JUDGMENT: the conductor, the scope/decompose judges, the reviewer).
# Aliases must be models the WORKER account (the Guest-House user's subscription) can actually
# run; an unresolvable alias fails open to `standard` with a warning (never silently up to
# frontier — a typo must not upgrade a worker's model). '' only if `standard` is itself unmapped.
models:
  frontier: ""
  standard: "claude-sonnet-4-6"
  fast: "claude-haiku-4-5"

# --- held-out hygiene (§7) --------------------------------------------------
held_out:
  # Retire a held-out scenario once it has influenced this many promotion
  # decisions (leakage budget). Replace from freshly mined, vetted scenarios.
  leakage_threshold: 5
  # How often the held-out set is sampled during a promotion check.
  sample_size: 1

# --- promotion rule (§9) — evaluated, then surfaced to the HUMAN gate -------
promotion:
  # A challenger must beat the champion on the working set by at least this
  # margin (pass-rate delta) to be queued.
  working_set_min_delta: 0.0001
  # It must not regress on the held-out sample or across the model panel by
  # more than this tolerance.
  regression_tolerance: 0.0
  # Nothing promotes automatically in Phase 0. Promotion is a human action.
  autonomous: false

# --- autonomy: the unattended 09:00 daily run -------------------------------
autonomy:
  # `factory daily` (the launchd 09:00 agent) runs a LARGER bounded session so
  # the factory makes real headway overnight. These are HARD ceilings; the loop
  # still stops early on no-improvement / research-exhausted. Promotion is NEVER
  # automatic — candidates only ever reach 'awaiting_gate' for the human.
  daily_max_rounds: 8
  daily_token_budget: 500000        # PER-SHIFT token budget (enforced — see enforce_shift_budget)
  # the continuous `run --loop` / autopilot ceilings (HARD brakes for unattended AUTO):
  loop_token_budget: 5000000        # stop after ~5M cumulative output tokens across shifts (0 = unlimited)
  loop_deadline_s: 14400            # …or after 4h wall-clock, whichever first (+ max_shifts=50)
  # circuit breaker: halt + durably brake (AUTO→SHIFT) after this many CONSECUTIVE failed shifts.
  # error/timed_out shifts ledger ~0 tokens, so the token ceiling never catches a failure storm.
  max_consecutive_errors: 3
  error_backoff_s: 30               # backoff between consecutive failed shifts before retrying
  # HARD per-shift brake (Task 0.2): once a shift's LEDGERED spend reaches its token_budget,
  # the rail skips the executor, requeues the claimed work and ends the shift
  # 'budget_exhausted' (a shift token_budget of 0 = unlimited, matching loop_token_budget).
  # A BRAKE, not autonomy: defaults true and is deliberately config.yaml-only — never in
  # SETTINGS_SPEC, so it cannot be flipped off from the board.
  enforce_shift_budget: true
  # Prod-push quality gate (Theme 4): re-run the TARGET's test suite on the integrated
  # factory/auto tip inside graduate_and_push before pushing to the real repo — each per-task
  # merge tested only its own change, not the tip. Fail-CLOSED (a red tip skips the push; work
  # stays on factory/auto, fully reversible). A BRAKE, config.yaml-only like enforce_shift_budget
  # (the board can't disable it). Set false if the target's suite is too slow to run per graduation.
  graduation_retest: true
  # Human-queue approval gate (2026-07-08 design, §3): outward GitHub pushes (base-branch
  # graduation AND base→release publication) pause as `pending_approvals` rows for GUI
  # approval instead of pushing directly — nothing leaves the machine without an explicit
  # Approve click in the fleet dashboard's Queue tab. A BRAKE, config.yaml-only like
  # enforce_shift_budget/graduation_retest: autonomy is turned UP by a file edit, never by
  # a browser click, so this is deliberately NOT in SETTINGS_SPEC (the board can't disable
  # it). Set false to restore the pre-2026-07-08 behavior (push immediately after a shift).
  push_approval: true
  # Task 5.1 — unattended-failure event trigger. When true, a swallowed REAL-mode
  # graduation/issue-sync error becomes a DEDUPED, conductor-only backlog task (escalate
  # to @human — the rail cannot fix factory infrastructure) + a factory learning, instead
  # of vanishing into a log print. New autonomous behavior → defaults OFF.
  failure_tasks: false
  # Publication broker (docs/plans/2026-08-06-publication-broker-design.md): when true,
  # an APPROVED graduation/promotion never pushes origin or calls `gh` from the factory
  # side at all — it pushes the tip to a LOCAL bare spool repo and writes a publication
  # envelope for an operator-run broker (`factory broker run-once|watch|status`, a
  # LaunchAgent under the operator's OWN account) to re-verify against live git state and
  # push for real with the operator's own credential. The factory holds no GitHub
  # credential in this mode. A BRAKE-shaped structural knob, config.yaml-only like every
  # other autonomy.* key: turning it on is a deliberate operator file edit (after removing
  # GH_TOKEN from the factory user's secrets per the runbook), never a board click.
  # Default OFF — false reproduces the pre-broker push path byte-for-byte.
  publication_broker: false
  # How long a prepared envelope stays valid before the broker refuses it outright
  # (expired, never retried silently) — the operator's broker may be offline/asleep for a
  # while; this bounds how stale an unexecuted approval is allowed to get. Config-only,
  # frozen via the autonomy. prefix, like every other key in this block.
  envelope_ttl_hours: 24
  # The factory-side half of connecting the two broker components (round-2 integration
  # fix — a fresh install otherwise wakes the operator's broker on the shared outbox
  # while the factory writes envelopes into its OWN checkout's default spool, so the
  # broker polls a directory the factory never touches). MUST match the SPOOL_ROOT
  # 04-install-broker-agent.sh provisioned on the operator's side (it prints the exact
  # value to paste here as its final step) — e.g. "/Users/Shared/factory-broker".
  # Empty (default) preserves the pre-existing default resolution (dev/single-user mode,
  # tests: <factory>/state/broker, or the FACTORY_BROKER_SPOOL env var).
  broker_spool_root: ""

# --- grade: the merge-quality gate (real behavioral grade vs the _smoke_grade stub) --------
grade:
  # 'stub' (DEFAULT): the do-no-harm-on-tests stub — a merge gates on tests-green + frozen only,
  # with NO behavioral signal. 'smoke': run a cheap SUBSET of the clive scenario eval against the
  # CANDIDATE's own clive source per merge (working-set do-no-harm + safety; held-out + divergence
  # are deferred to `factory rebaseline`, which protects the held-out set from per-merge leakage).
  # Config-only; 'smoke' adds ~1-3 min + ~50k tok per merge and measures a champion baseline once
  # per shift. See docs/plans/2026-07-07-real-merge-grade-design.md.
  mode: smoke
  # the inline smoke subset — cheap local-sandbox scenarios, single-class (multi-clive isn't wired
  # into the inline path). Override to widen/narrow the behavioral sample.
  smoke_scenarios: [gate-demo, hard-invoice-sum]
  # `factory rebaseline` (periodic full re-baseline: full suite + held-out vs the champion) auto-
  # reverts the champion's factory/auto HEAD when it regresses vs the stored baseline. A real-repo
  # mutation → default OFF (report-only); flip on for a self-healing champion. Off the merge path.
  rebaseline_autorevert: false

# --- autopilot: the dashboard AUTO toggle's runner --------------------------
autopilot:
  # Toggling AUTO on the board spawns `factory run --loop` with these. real=true lands gated
  # merges on the REVERSIBLE factory/auto branch (the useful default). prod=true runs the
  # conductor + workers as the isolated Guest-House `agent` user (no access to your $HOME,
  # credentials, API key, or MCP servers) — the required posture for an UNATTENDED run, since
  # a prompt-injected brief or a fetched web page could otherwise drive Bash as YOU. Set
  # prod=false ONLY for attended DEV runs you are actively watching (same-user: workers run as
  # YOU with Bash + your MCP — NOT a security boundary). real=false → throwaway clones, no merges.
  real: true
  prod: true

# --- board ------------------------------------------------------------------
dashboard:
  host: "127.0.0.1"
  port: 8787
